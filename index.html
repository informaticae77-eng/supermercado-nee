<!-- MODAL CREAR / EDITAR SUPERMERCADO CON LOGO Y NOMBRE -->
<div id="supermarketModal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-3xl max-w-md w-full p-6 space-y-4 shadow-2xl">
        <h3 id="modalSupTitle" class="text-xl font-black text-slate-800">Agregar Supermercado</h3>
        <input type="hidden" id="modalSupId">
        
        <div>
            <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Nombre del Supermercado:</label>
            <input type="text" id="modalSupName" placeholder="Ej: LIDER, JUMBO, UNIMARC..." class="w-full px-4 py-2.5 rounded-xl border-2 border-slate-300 font-bold text-xs">
        </div>
        
        <div>
            <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Logo / Imagen de la Tienda:</label>
            <input type="file" accept="image/*" onchange="handleSupermarketLogoUpload(event)" class="w-full text-xs font-bold text-slate-600 border border-slate-300 p-2 rounded-xl">
            <input type="hidden" id="modalSupLogo">
            
            <div id="modalSupLogoPreview" class="mt-2 h-24 w-full rounded-2xl border-2 border-dashed border-slate-300 flex items-center justify-center overflow-hidden bg-slate-50">
                <span class="text-xs font-bold text-slate-400">Sin logo cargado</span>
            </div>
        </div>

        <div class="flex gap-2 pt-2">
            <button onclick="closeSupermarketModal()" class="w-1/3 bg-slate-200 text-slate-800 font-bold py-2.5 rounded-xl text-xs">Cancelar</button>
            <button onclick="saveSupermarketFromModal()" class="w-2/3 bg-emerald-600 hover:bg-emerald-700 text-white font-black py-2.5 rounded-xl text-xs shadow">Guardar Tienda</button>
        </div>
    </div>
</div>
