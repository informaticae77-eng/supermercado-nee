<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SuperMercado NEE - Chile</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.8/css/all.min.css">

    <!-- Librerías Externas -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>

    <!-- SDKs de Firebase (v8 compat) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
</head>
<body class="bg-slate-100 min-h-screen font-sans text-slate-800 pb-12">

    <!-- ENCABEZADO PRINCIPAL -->
    <header class="bg-white border-b-4 border-indigo-600 shadow-md sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between gap-2">
            <div class="flex items-center space-x-3 cursor-pointer" onclick="goHome()">
                <div class="bg-indigo-600 text-white p-2.5 rounded-2xl text-2xl shadow-md">🛒</div>
                <div>
                    <h1 class="text-xl sm:text-2xl font-black text-indigo-950 tracking-tight leading-none">SuperMercado NEE</h1>
                    <span class="text-[10px] font-bold text-indigo-600 uppercase tracking-widest">Chile PIE</span>
                </div>
            </div>

            <div class="flex items-center gap-2 sm:gap-3">
                <div id="missionTimerBadge" class="hidden bg-amber-400 text-slate-900 font-black px-3 py-1.5 rounded-xl border-2 border-amber-600 flex items-center gap-1.5 text-xs shadow">
                    <span>⏱️</span>
                    <span id="missionTimerText">00:00</span>
                </div>

                <div id="userInfoHeader" class="flex items-center gap-2"></div>

                <button id="headerBasketBtn" onclick="openBasketModal()" class="relative bg-emerald-600 hover:bg-emerald-700 text-white font-black px-3.5 py-2 rounded-2xl shadow border-b-4 border-emerald-900 flex items-center gap-2 active:scale-95 text-xs sm:text-sm">
                    <i class="fa-solid fa-basket-shopping"></i>
                    <span class="hidden sm:inline">Canasto</span>
                    <span id="basketBadge" class="bg-amber-400 text-slate-900 px-2 py-0.5 rounded-full text-xs font-black">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- CONTENEDOR DINÁMICO DE LA APLICACIÓN -->
    <main id="appContainer" class="max-w-7xl mx-auto px-4 py-6"></main>

    <!-- MODAL: CREAR / EDITAR USUARIO -->
    <div id="userModal" class="hidden fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 overflow-y-auto">
        <div class="bg-white w-full max-w-lg rounded-3xl border-4 border-indigo-600 shadow-2xl p-6 space-y-4 my-6">
            <div class="flex justify-between items-center border-b pb-2">
                <h3 id="userModalTitle" class="text-xl font-black text-indigo-950">Crear Usuario</h3>
                <button onclick="closeUserModal()" class="text-slate-400 hover:text-slate-700 font-bold text-xl">✕</button>
            </div>

            <input type="hidden" id="modalUserId">
            <input type="hidden" id="modalUserRole">
            <input type="hidden" id="modalPhotoUrl">

            <div class="space-y-3 text-xs font-bold">
                <div>
                    <label class="block uppercase text-slate-600 mb-1">Nombre Completo:</label>
                    <input type="text" id="modalName" placeholder="Ej: Juan Pérez" class="w-full px-3 py-2.5 border-2 border-slate-300 rounded-xl focus:border-indigo-500 focus:outline-none">
                </div>
                <div>
                    <label class="block uppercase text-slate-600 mb-1">RUT (o Identificador):</label>
                    <input type="text" id="modalRut" placeholder="12345678-9" class="w-full px-3 py-2.5 border-2 border-slate-300 rounded-xl focus:border-indigo-500 focus:outline-none">
                </div>
                <div>
                    <label class="block uppercase text-slate-600 mb-1">Correo Electrónico:</label>
                    <input type="email" id="modalEmail" placeholder="correo@escuela.cl" class="w-full px-3 py-2.5 border-2 border-slate-300 rounded-xl focus:border-indigo-500 focus:outline-none">
                </div>

                <div id="modalSingleCourseContainer">
                    <label class="block uppercase text-slate-600 mb-1">Curso Asignado:</label>
                    <select id="modalCourse" class="w-full px-3 py-2.5 border-2 border-slate-300 rounded-xl focus:border-indigo-500 focus:outline-none bg-white"></select>
                </div>

                <div id="modalMultiCourseContainer" class="hidden space-y-2">
                    <div class="flex justify-between items-center">
                        <label class="uppercase text-slate-600">Cursos a Cargo:</label>
                        <div class="space-x-2 text-[10px]">
                            <button type="button" onclick="selectAllModalCourses(true)" class="text-indigo-600 underline">Todos</button>
                            <button type="button" onclick="selectAllModalCourses(false)" class="text-rose-600 underline">Ninguno</button>
                        </div>
                    </div>
                    <div id="modalMultiCourseCheckboxes" class="bg-slate-50 p-3 rounded-xl border border-slate-200 max-h-32 overflow-y-auto space-y-1"></div>
                </div>

                <div class="border-t pt-3 space-y-2">
                    <label class="block uppercase text-slate-600">Fotografía de Perfil:</label>
                    <div class="flex flex-wrap gap-2">
                        <input type="file" id="userPhotoFileInput" accept="image/*" onchange="handleImageFileSelect(event)" class="hidden">
                        <button type="button" onclick="document.getElementById('userPhotoFileInput').click()" class="bg-indigo-100 text-indigo-900 px-3 py-1.5 rounded-xl border border-indigo-300">📷 Archivo</button>
                        <button type="button" onclick="startCameraStream()" class="bg-emerald-100 text-emerald-900 px-3 py-1.5 rounded-xl border border-emerald-300">📹 Cámara</button>
                    </div>

                    <div id="cameraContainer" class="hidden space-y-2 pt-2">
                        <video id="cameraVideo" autoplay playsinline class="w-48 h-48 object-cover rounded-2xl border-2 border-indigo-500 mx-auto"></video>
                        <button type="button" onclick="takeCameraSnapshot()" class="w-full bg-emerald-600 text-white py-1.5 rounded-xl font-black">Capturar Foto</button>
                    </div>

                    <div id="photoPreviewContainer" class="hidden relative w-20 h-20 border-2 border-indigo-500 rounded-2xl overflow-hidden mt-2">
                        <img id="photoPreview" class="w-full h-full object-cover">
                        <button type="button" onclick="removeUserPhoto()" class="absolute top-1 right-1 bg-rose-600 text-white rounded-full w-5 h-5 flex items-center justify-center text-xs">✕</button>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-3 pt-2">
                <button type="button" onclick="closeUserModal()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold py-2.5 rounded-xl text-xs">Cancelar</button>
                <button type="button" onclick="saveUserFromModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-black py-2.5 rounded-xl border-b-4 border-indigo-900 shadow text-xs">Guardar Usuario</button>
            </div>
        </div>
    </div>

    <!-- MODAL: CREAR / EDITAR CATEGORÍA (z-[100] para aparecer sobre productos) -->
    <div id="categoryModal" class="hidden fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-3xl border-4 border-indigo-600 shadow-2xl p-6 space-y-4">
            <div class="flex justify-between items-center border-b pb-2">
                <h3 id="catModalTitle" class="text-xl font-black text-indigo-950">Crear Categoría</h3>
                <button onclick="closeCategoryModal()" class="text-slate-400 hover:text-slate-700 font-bold text-xl">✕</button>
            </div>
            <input type="hidden" id="modalCatId">
            <div class="space-y-3">
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Nombre de la Categoría:</label>
                    <input type="text" id="modalCatName" placeholder="Ej: Bebidas, Abarrotes, Higiene..." class="w-full px-4 py-2.5 border-2 border-slate-300 rounded-xl font-bold focus:border-indigo-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Elegir Ícono / Emoji:</label>
                    <div class="flex gap-2">
                        <input type="text" id="modalCatIcon" value="🏷️" class="w-16 text-center text-2xl border-2 border-slate-300 rounded-xl font-bold focus:border-indigo-500 focus:outline-none">
                        <div class="flex-1 flex flex-wrap gap-1.5 bg-slate-100 p-2 rounded-xl border border-slate-200">
                            <button type="button" onclick="selectCategoryIconEmoji('🥛')" class="text-2xl hover:scale-125 transition-transform">🥛</button>
                            <button type="button" onclick="selectCategoryIconEmoji('🧹')" class="text-2xl hover:scale-125 transition-transform">🧹</button>
                            <button type="button" onclick="selectCategoryIconEmoji('🍎')" class="text-2xl hover:scale-125 transition-transform">🍎</button>
                            <button type="button" onclick="selectCategoryIconEmoji('🥖')" class="text-2xl hover:scale-125 transition-transform">🥖</button>
                            <button type="button" onclick="selectCategoryIconEmoji('🍪')" class="text-2xl hover:scale-125 transition-transform">🍪</button>
                            <button type="button" onclick="selectCategoryIconEmoji('🥫')" class="text-2xl hover:scale-125 transition-transform">🥫</button>
                            <button type="button" onclick="selectCategoryIconEmoji('🧃')" class="text-2xl hover:scale-125 transition-transform">🧃</button>
                            <button type="button" onclick="selectCategoryIconEmoji('🧼')" class="text-2xl hover:scale-125 transition-transform">🧼</button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="grid grid-
