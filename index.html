            { id: 'prod-7', supermarketId: 'sup-unimarc', name: 'Paquete de Galletas', category: 'Snacks', price: 800, iconEmoji: '🍪' },

        // Carga dinámica de voces para Firefox
        let systemVoices = [];
        function loadVoices() {
            if ('speechSynthesis' in window) {
                systemVoices = window.speechSynthesis.getVoices();
            }
        }
        loadVoices();
        if ('speechSynthesis' in window && window.speechSynthesis.onvoiceschanged !== undefined) {
            window.speechSynthesis.onvoiceschanged = loadVoices;
        }

        function loadFromLocalStorage() {
            try {
                const storedSup = localStorage.getItem('nee_supermarkets');
                const storedProd = localStorage.getItem('nee_products');
                
                let parsedSup = storedSup ? JSON.parse(storedSup) : null;
                let parsedProd = storedProd ? JSON.parse(storedProd) : null;

                APP_STATE.supermarkets = (Array.isArray(parsedSup) && parsedSup.length > 0) ? parsedSup : [...DEFAULT_SUPERMARKETS];
                APP_STATE.products = (Array.isArray(parsedProd) && parsedProd.length > 0) ? parsedProd : [...DEFAULT_PRODUCTS];
            } catch (e) {
                APP_STATE.supermarkets = [...DEFAULT_SUPERMARKETS];
                APP_STATE.products = [...DEFAULT_PRODUCTS];
            }
        }

        function saveSupermarkets() { localStorage.setItem('nee_supermarkets', JSON.stringify(APP_STATE.supermarkets)); }
        function saveProducts() { localStorage.setItem('nee_products', JSON.stringify(APP_STATE.products)); }

        function cleanTextForSpeech(text) {
            if (!text) return '';
            return text.replace(/\$/g, '').replace(/\bCLP\b/gi, 'pesos chilenos').replace(/\bpesos\b/gi, 'pesos chilenos');
        }

        /* SÍNTESIS ADAPTADA A FIREFOX */
        function speakText(text) {
            if (!('speechSynthesis' in window)) return;
            try {
                window.speechSynthesis.cancel();
                const cleanText = cleanTextForSpeech(text);
                if (!cleanText) return;

                // Retardo de 100ms necesario para que Firefox no ignore el comando speak()
                setTimeout(() => {
                    const utterance = new SpeechSynthesisUtterance(cleanText);
                    
                    if (systemVoices.length === 0) {
                        systemVoices = window.speechSynthesis.getVoices();
                    }

                    // Busca voz en español chileno primero, luego cualquier voz en español
                    const spanishVoice = systemVoices.find(v => v.lang === 'es-CL') || 
                                         systemVoices.find(v => v.lang.startsWith('es'));

                    if (spanishVoice) {
                        utterance.voice = spanishVoice;
                        utterance.lang = spanishVoice.lang;
                    } else {
                        utterance.lang = 'es';
                    }

                    utterance.rate = 0.88;
                    utterance.pitch = 1.0;
                    window.speechSynthesis.speak(utterance);
                }, 100);
            } catch(e) {}
        }

        function playChimeSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(783.99, audioCtx.currentTime + 0.25);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            } catch(e) {}
        }

        function calculateCLPBreakdown(amount) {
            if (!amount || amount <= 0) return [];
            let remaining = Math.round(amount / 10) * 10;
            const breakdown = [];
            const denominations = [
                { val: 20000, id: 'b20k' }, { val: 10000, id: 'b10k' }, { val: 5000, id: 'b5k' },
                { val: 2000, id: 'b2k' },   { val: 1000, id: 'b1k' },   { val: 500, id: 'c500' },
                { val: 100, id: 'c100' },   { val: 50, id: 'c50' },     { val: 10, id: 'c10' }
            ];

            for (const item of denominations) {
                if (remaining >= item.val) {
                    const count = Math.floor(remaining / item.val);
                    remaining %= item.val;
                    const meta = CLP_CURRENCY_ITEMS.find(c => c.id === item.id);
                    breakdown.push({ ...meta, count });
                }
            }
            return breakdown;
        }

        function renderCurrencySVG(item, size = 'md') {
            const isBill = item.type === 'bill';
            let height = size === 'sm' ? 'h-8' : (size === 'lg' ? 'h-16' : 'h-12');
            let width = size === 'sm' ? 'w-14' : (size === 'lg' ? 'w-32' : 'w-22');

            if (!isBill) {
                height = size === 'sm' ? 'h-8' : (size === 'lg' ? 'h-14' : 'h-10');
                width = size === 'sm' ? 'w-8' : (size === 'lg' ? 'w-14' : 'w-10');
            }

            if (isBill) {
                return `
                    <div class="currency-item inline-flex flex-col items-center ${width}${height} relative shadow-md rounded-lg overflow-hidden border border-slate-700 select-none text-white" style="background-color: ${item.color};">
                        <div class="w-full flex justify-between px-1 text-[7px] font-black opacity-90">
                            <span>CHILE</span><span>$${item.value.toLocaleString('es-CL')}</span> </div> <div class="flex-1 flex items-center justify-center font-black text-xs"> $${item.value.toLocaleString('es-CL')}
                        </div>
                    </div>
                `;
            } else {
                const isBimetallic = item.value === 500;
                return `
                    <div class="currency-item inline-flex items-center justify-center ${width}${height} rounded-full border border-slate-700 shadow-md font-black text-slate-900 text-xs"
                         style="background: ${isBimetallic ? 'radial-gradient(circle, #F59E0B 48\%, #9CA3AF 50\%)' : '#F59E0B'};"> $${item.value}
                    </div>
                `;
            }
        }

        function renderBreakdownHTML(breakdownArray, size = 'md') {
            if (!breakdownArray || breakdownArray.length === 0) return '<span class="text-xs text-slate-400 italic">Sin precio</span>';
            let html = '<div class="flex flex-wrap gap-2 items-center">';
            breakdownArray.forEach(item => {
                for (let i = 0; i < (item.count || 1); i++) {
                    html += renderCurrencySVG(item, size);
                }
            });
            html += '</div>';
            return html;
        }

        function renderApp() {
            const container = document.getElementById('appContainer');
            const headerBasketBtn = document.getElementById('headerBasketBtn');
            const modeLabel = document.getElementById('modeLabel');
            const modeIcon = document.getElementById('modeIcon');

            if (!container) return;

            if (APP_STATE.currentMode === 'teacher') {
                if (modeLabel) modeLabel.textContent = 'Modo Niños';
                if (modeIcon) modeIcon.className = 'fa-solid fa-child text-lg';
                if (headerBasketBtn) headerBasketBtn.classList.add('hidden');
                renderTeacherView(container);
            } else {
                if (modeLabel) modeLabel.textContent = 'Modo Educador';
                if (modeIcon) modeIcon.className = 'fa-solid fa-user-gear text-lg';
                if (APP_STATE.selectedSupermarketId) {
                    if (headerBasketBtn) headerBasketBtn.classList.remove('hidden');
                    renderSupermarketView(container, APP_STATE.selectedSupermarketId);
                } else {
                    if (headerBasketBtn) headerBasketBtn.classList.add('hidden');
                    renderHomeView(container);
                }
            }
            updateBasketBadge();
        }

        function goHome() {
            APP_STATE.selectedSupermarketId = null;
            renderApp();
        }

                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
            `;

            APP_STATE.supermarkets.forEach(sup => {
                const count = APP_STATE.products.filter(p => p.supermarketId === sup.id).length;
                html += `
                    <div onclick="selectSupermarket('${sup.id}')"
                         class="bg-white rounded-3xl border-4 ${sup.borderColor || 'border-slate-300'} p-6 shadow-lg hover:shadow-2xl transition-all cursor-pointer flex flex-col items-center text-center space-y-4 touch-focus active:scale-95 group">
                        <div class="${sup.themeColor || 'bg-amber-400'} text-5xl p-6 rounded-3xl shadow-inner group-hover:scale-110 transition-transform">
                            ${sup.icon || '🛒'}
                        </div>
                        <div>
                            <h3 class="text-2xl font-black ${sup.textColor \vert{}\vert{} 'text-slate-800'}">${sup.name}</h3>
                            <p class="text-xs font-semibold text-slate-500 mt-1">${sup.description || 'Supermercado'}</p>
                        </div>
                        <span class="bg-slate-100 text-slate-700 text-xs font-bold px-3 py-1 rounded-full border border-slate-300">

            html += `</div></div>`;
            container.innerHTML = html;
        }

        function selectSupermarket(id) {
            APP_STATE.selectedSupermarketId = id;
            const sup = APP_STATE.supermarkets.find(s => s.id === id);
            renderApp();
            if (sup) speakText(`Entrando a ${sup.name}`);
        }

        function renderSupermarketView(container, supId) {
            const sup = APP_STATE.supermarkets.find(s => s.id === supId);
            const products = APP_STATE.products.filter(p => p.supermarketId === supId);

            if (!sup) { goHome(); return; }

            let html = `
                <div class="space-y-6">
                    <div class="flex flex-wrap items-center justify-between gap-4 bg-white p-4 rounded-2xl border-2 border-slate-300 shadow-sm">
                        <button onclick="goHome()" class="bg-slate-200 hover:bg-slate-300 text-slate-800 font-bold px-4 py-2 rounded-xl flex items-center space-x-2 border-b-4 border-slate-400 active:scale-95 touch-focus">
                            <i class="fa-solid fa-arrow-left"></i>
                            <span>Volver</span>
                        </button>
                        <div class="flex items-center space-x-3">
                            <span class="text-3xl">${sup.icon || '🛒'}</span>
                            <h2 class="text-2xl font-black text-slate-800">${sup.name}</h2>
                        </div>
                    </div>
            `;

            if (products.length === 0) {
                html += `
                    <div class="bg-white p-12 rounded
